# Render Blueprint: GitHub-ийн main салбарт өөрчлөлт орох бүрт автоматаар дахин байршуулна. HTTPS автомат.
services:
  - type: web
    name: hot-tuluwlult
    runtime: docker
    region: singapore
    plan: free # 15 минут хэрэглээгүй бол унтана, сэрэхэд ~1 минут
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ARCGIS_PORTAL_URL
        value: https://arcgis.ubhub.mn/arcgis
